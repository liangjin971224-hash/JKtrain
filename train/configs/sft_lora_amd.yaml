# AMD 192GB / ROCm：不量化，BF16 纯 LoRA。这是首轮主用配置。
model_name_or_path: /mnt/workspace/models/R1-0528-Qwen3-8B
trust_remote_code: true

stage: sft
do_train: true
finetuning_type: lora
lora_rank: 8
lora_alpha: 32
lora_dropout: 0.05
lora_target: all

dataset_dir: /mnt/workspace/data
dataset: health_qa_train
eval_dataset: health_qa_val
template: deepseekr1
# 与 Q11 一致：只学最终答案。训练与推理必须用同一取值，否则分布不一致。
enable_thinking: false
cutoff_len: 2048
preprocessing_num_workers: 4
overwrite_cache: true

output_dir: __OUTPUT_DIR__
logging_steps: 5
save_steps: 20
save_total_limit: 3
plot_loss: true
overwrite_output_dir: false
report_to: none

per_device_train_batch_size: 4
per_device_eval_batch_size: 2
gradient_accumulation_steps: 4
learning_rate: 2.0e-5
num_train_epochs: 2.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
gradient_checkpointing: false
seed: 42
