# 第三轮：数据补齐「证据必须支撑答案」后再训。3 epoch，多留检查点。
model_name_or_path: /mnt/workspace/models/R1-0528-Qwen3-8B
trust_remote_code: true

stage: sft
do_train: true
finetuning_type: lora
quantization_bit: 4
quantization_method: bnb
lora_rank: 8
lora_alpha: 32
lora_dropout: 0.05
lora_target: all

dataset_dir: /mnt/workspace/data
dataset: health_qa_train
eval_dataset: health_qa_val
template: deepseekr1
# 与 Q11 一致：只学最终答案。训练与推理必须用同一取值，否则分布不一致。
enable_thinking: false
cutoff_len: 2048
preprocessing_num_workers: 4
overwrite_cache: true

output_dir: __OUTPUT_DIR__
logging_steps: 5
save_steps: 10
save_total_limit: 5
plot_loss: true
overwrite_output_dir: false
report_to: none

per_device_train_batch_size: 1
per_device_eval_batch_size: 1
# 73 条 ÷ 4 = 每 epoch 19 步，3 epoch = 57 步
gradient_accumulation_steps: 4
learning_rate: 1.0e-4
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
gradient_checkpointing: true
seed: 42
